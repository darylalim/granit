[theme.dark.sidebar]
backgroundColor = "#0C0A09"               # stone-950: one step darker than the page, mirroring light mode
secondaryBackgroundColor = "#1C1917"
codeBackgroundColor = "#1C1917"
borderColor = "#292524"
